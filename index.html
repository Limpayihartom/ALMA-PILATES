<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <!-- Versión autocontenida generada por scripts/build.py. Las imágenes se cargan desde assets/images/ (ver config.js → imagesBase). -->
  <title>ALMA PILATES · Programa de Pilates Asiático de 28 días</title>
  <meta name="description" content="Encuentra tu plan personalizado de Pilates Asiático de 28 días. 15 minutos al día, desde casa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
/* ALMA PILATES · Quiz funnel
 * Paleta obligatoria:
 *   fondo #FAF5F0 · verde #526453 · verde secundario #A5AF92 · beige #E6BDB5
 *   texto #303B30 · blanco #FFFFFF · bordes #DDE5DA
 * Tipografías: Playfair Display (titulares) · DM Sans (textos, botones, preguntas)
 */

:root {
  --bg: #FAF5F0;
  --green: #526453;
  --gold: #B99A60;
  --rose: #E6BDB5;
  --green-2: #A5AF92;
  --beige: #E6BDB5;
  --text: #303B30;
  --white: #FFFFFF;
  --border: #DDE5DA;
  --muted: #5F6F62;
  --radius-lg: 22px;
  --radius-program: 16px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --shadow-soft: 0 1px 2px rgba(38, 53, 43, 0.06), 0 6px 18px rgba(38, 53, 43, 0.05);
  --font-head: "Playfair Display", "Times New Roman", Georgia, serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

img { display: block; max-width: 100%; height: auto; }

button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 3px;
  border-radius: 6px;
}

[hidden] { display: none !important; }

/* ---------- Contenedor ---------- */
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 0 16px 32px;
  display: flex;
  flex-direction: column;
}

@media (min-width: 720px) {
  body { background: #F0E9E1; padding: 24px 0; }
  .app {
    min-height: calc(100vh - 48px);
    background: var(--bg);
    border-radius: 28px;
    box-shadow: var(--shadow-soft);
    overflow: hidden;
    padding-bottom: 24px;
  }
}

/* ---------- Barra superior ---------- */
.topbar {
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  padding: 14px 0 8px;
  gap: 4px;
}

.icon-btn {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  display: inline-grid;
  place-items: center;
  cursor: pointer;
}
.icon-btn:hover { background: var(--border); }
/* Mantiene el espacio del botón "atrás" aunque esté oculto (la marca queda centrada) */
#back-btn[hidden] { display: inline-grid !important; visibility: hidden; }

.brand {
  text-align: center;
  font-family: var(--font-head);
  font-weight: 600;
  letter-spacing: 0.12em;
  font-size: 15px;
  color: var(--green);
  line-height: 1.1;
}
.brand__tagline {
  display: block;
  font-family: var(--font-body);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 3px;
}
.brand img { max-height: 30px; width: auto; margin: 0 auto; }

.step-count {
  text-align: right;
  font-size: 13px;
  color: var(--muted);
  min-width: 44px;
}

/* ---------- Progreso ---------- */
.progress {
  height: 4px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
  margin: 6px 0 4px;
}
.progress__bar {
  height: 100%;
  width: 0;
  background: var(--green);
  border-radius: 999px;
  transition: width 0.5s var(--ease);
}

/* ---------- Escenario y transiciones ---------- */
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  outline: none;
  padding-top: 12px;
}

.screen {
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: screen-in 0.45s var(--ease) both;
}
.screen--back { animation-name: screen-in-back; }

@keyframes screen-in {
  from { opacity: 0; transform: translateX(22px); }
  to { opacity: 1; transform: none; }
}
@keyframes screen-in-back {
  from { opacity: 0; transform: translateX(-22px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .screen, .screen--back, .progress__bar { animation: none; transition: none; }
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--green);
  font-weight: 600;
  margin: 8px 0 0;
}

.title {
  font-family: var(--font-head);
  font-weight: 600;
  font-size: 28px;
  line-height: 1.18;
  margin: 0;
  color: var(--text);
  text-wrap: balance;
}
.title--hero { font-size: 31px; }

.subtitle {
  margin: 0;
  color: var(--muted);
  font-size: 16px;
}

.question {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.3;
  margin: 6px 0 0;
  color: var(--text);
}

.note {
  margin: 0;
  font-size: 15px;
  color: var(--muted);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.note--alert {
  background: #F7EFE9;
  border-color: var(--beige);
  color: var(--text);
}

/* ---------- Botones ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 56px;
  padding: 14px 22px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 0.02em;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.2s var(--ease), background-color 0.2s, opacity 0.2s;
  width: 100%;
}
.btn:active { transform: scale(0.985); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn--primary { background: var(--green); color: var(--white); }
.btn--primary:hover:not(:disabled) { background: #465747; }
.btn--ghost { background: transparent; color: var(--green); border-color: var(--green-2); }
.btn--ghost:hover { background: var(--white); }
.btn--small { min-height: 44px; padding: 10px 18px; font-size: 14px; width: auto; }
.btn--link {
  background: none;
  border: 0;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
  min-height: 40px;
  width: auto;
  align-self: center;
  font-size: 14px;
  padding: 6px;
}

/* ---------- Opciones (selección única / múltiple) ---------- */
.options {
  list-style: none;
  padding: 0;
  margin: 4px 0 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 60px;
  padding: 14px 16px;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  text-align: left;
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s, transform 0.2s var(--ease), box-shadow 0.2s;
  box-shadow: var(--shadow-soft);
}
.option:hover { border-color: var(--green-2); }
.option:active { transform: scale(0.99); }
.option[aria-pressed="true"],
.option[aria-checked="true"] {
  border-color: var(--green);
  background: #F2F4EE;
  box-shadow: 0 0 0 1px var(--green) inset;
}
.option__label { flex: 1; font-weight: 500; font-size: 16px; }
.option__sub { display: block; font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 2px; }

.option__mark {
  width: 22px;
  height: 22px;
  flex: 0 0 22px;
  border: 1.5px solid var(--green-2);
  border-radius: 50%;
  display: grid;
  place-items: center;
  transition: background-color 0.2s, border-color 0.2s;
}
.option--multi .option__mark { border-radius: 7px; }
.option[aria-pressed="true"] .option__mark,
.option[aria-checked="true"] .option__mark {
  background: var(--green);
  border-color: var(--green);
}
.option__mark svg { opacity: 0; transition: opacity 0.2s; }
.option[aria-pressed="true"] .option__mark svg,
.option[aria-checked="true"] .option__mark svg { opacity: 1; }

.option__thumb {
  width: 58px;
  height: 58px;
  flex: 0 0 58px;
  object-fit: cover;
  border-radius: 12px;
  background: var(--beige);
}

/* ---------- Tarjetas con foto (edad) ---------- */
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  list-style: none;
  padding: 0;
  margin: 4px 0 0;
}
.card {
  position: relative;
  display: block;
  width: 100%;
  padding: 0;
  border: 1.5px solid transparent;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--beige);
  cursor: pointer;
  aspect-ratio: 3 / 4;
  transition: transform 0.25s var(--ease), border-color 0.2s;
}
.card:hover { transform: translateY(-2px); }
.card[aria-pressed="true"] { border-color: var(--green); }
.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card__label {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 10px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--text);
  border-radius: 999px;
  padding: 9px 12px;
  font-weight: 600;
  font-size: 15px;
  text-align: center;
}

/* ---------- Opciones con foto grande ---------- */
.photo-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  list-style: none;
  padding: 0;
  margin: 4px 0 0;
}
.photo-option {
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 0;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  box-shadow: var(--shadow-soft);
  transition: border-color 0.2s, transform 0.2s var(--ease);
}
.photo-option img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.photo-option__label { padding: 12px 12px 14px; font-weight: 600; font-size: 15px; line-height: 1.3; }
.photo-option[aria-pressed="true"] { border-color: var(--green); box-shadow: 0 0 0 1px var(--green) inset; }
.photo-option:hover { transform: translateY(-2px); }
.photo-options > li:last-child:nth-child(odd) { grid-column: 1 / -1; }
.photo-options > li:last-child:nth-child(odd) .photo-option img { aspect-ratio: 16 / 9; }

/* ---------- Hero / educación ---------- */
.media {
  margin: 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--beige);
  aspect-ratio: 4 / 5;
}
.media img { width: 100%; height: 100%; object-fit: cover; }
.media--wide { aspect-ratio: 16 / 10; }

.pillars {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 10px;
}
.pillar {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 12px;
  align-items: start;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
}
.pillar__num {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--beige);
  color: var(--text);
  display: grid;
  place-items: center;
  font-family: var(--font-head);
  font-size: 18px;
  font-weight: 600;
}
.pillar__title { font-weight: 700; margin: 0; }
.pillar__text { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

/* ---------- Números (estatura / peso) ---------- */
.number-box {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 18px 18px;
  text-align: center;
  box-shadow: var(--shadow-soft);
}
.number-box__value {
  font-family: var(--font-head);
  font-size: 56px;
  line-height: 1;
  color: var(--green);
  margin: 0;
}
.number-box__unit { font-size: 16px; color: var(--muted); margin-left: 4px; }
.range {
  width: 100%;
  margin: 18px 0 6px;
  accent-color: var(--green);
  height: 32px;
}
.range__ends {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}

/* ---------- Carga ---------- */
.loading {
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
  text-align: center;
  padding-top: 24px;
}
.loader {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 3px solid var(--border);
  border-top-color: var(--green);
  animation: spin 1.1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.steps {
  list-style: none;
  padding: 0;
  margin: 0;
  width: 100%;
  display: grid;
  gap: 10px;
  text-align: left;
}
.steps li {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  color: var(--muted);
  opacity: 0.45;
  transition: opacity 0.4s, color 0.4s, border-color 0.4s;
}
.steps li.is-active { opacity: 1; color: var(--text); border-color: var(--green-2); }
.steps li.is-done { opacity: 1; color: var(--text); }
.steps__dot {
  width: 22px;
  height: 22px;
  flex: 0 0 22px;
  border-radius: 50%;
  border: 1.5px solid var(--green-2);
  display: grid;
  place-items: center;
}
.steps li.is-done .steps__dot { background: var(--green); border-color: var(--green); }
.steps li.is-done .steps__dot::after {
  content: "";
  width: 6px;
  height: 10px;
  border: solid var(--white);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}

/* ---------- Resultados ---------- */
.plan-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}
.plan-card__head {
  background: var(--green);
  color: var(--white);
  padding: 18px 20px;
}
.plan-card__head h2 {
  font-family: var(--font-head);
  font-size: 22px;
  margin: 0;
  font-weight: 600;
}
.plan-card__head p { margin: 4px 0 0; font-size: 14px; opacity: 0.92; }
.plan-rows { margin: 0; padding: 4px 0; }
.plan-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 20px;
  border-top: 1px solid var(--border);
}
.plan-row:first-child { border-top: 0; }
.plan-row dt { color: var(--muted); font-size: 14px; }
.plan-row dd { margin: 0; font-weight: 600; text-align: right; }

.calendar-preview {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  padding: 14px 16px 18px;
}
.cal-day {
  aspect-ratio: 1;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  background: #F4EEE7;
  color: var(--muted);
}
.cal-day--train { background: var(--green); color: var(--white); }
.cal-day--rest { background: #F4EEE7; }
.cal-legend {
  display: flex;
  gap: 16px;
  font-size: 12px;
  color: var(--muted);
  padding: 0 16px 16px;
}
.cal-legend span::before {
  content: "";
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-right: 6px;
  vertical-align: -1px;
  background: var(--green);
}
.cal-legend span.rest::before { background: #E9E1D6; }

/* ---------- Presentación / oferta ---------- */
.mockups {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.mockups img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: var(--radius-md);
  background: var(--beige);
}
.mockups img.wide { grid-column: span 2; aspect-ratio: 16 / 10; }

.feature-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 10px;
}
.feature-list li {
  position: relative;
  padding: 12px 14px 12px 42px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
}
.feature-list li::before {
  content: "";
  position: absolute;
  left: 16px;
  top: 50%;
  width: 14px;
  height: 8px;
  border: solid var(--green);
  border-width: 0 0 2.5px 2.5px;
  transform: translateY(-70%) rotate(-45deg);
}

.price-box {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  text-align: center;
  box-shadow: var(--shadow-soft);
}
.price-box__label { font-size: 13px; color: var(--muted); margin: 0; letter-spacing: 0.06em; text-transform: uppercase; }
.price-box__price {
  font-family: var(--font-head);
  font-size: 40px;
  color: var(--text);
  margin: 4px 0 2px;
  line-height: 1.1;
}
.price-box__meta { margin: 0; font-size: 14px; color: var(--muted); }

.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; font-size: 15px; }
.checklist li { padding-left: 26px; position: relative; }
.checklist li::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 8px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}

.payments { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
.payments li {
  font-size: 13px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--white);
}

.faq { display: grid; gap: 8px; }
.faq details {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0 14px;
}
.faq summary {
  cursor: pointer;
  list-style: none;
  padding: 14px 0;
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-size: 20px; color: var(--green); line-height: 1; }
.faq details[open] summary::after { content: "–"; }
.faq details p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }

.cta-wrap { display: flex; flex-direction: column; gap: 10px; }
.cta-note { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }

/* Barra fija de compra en móvil */
.sticky-cta {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: rgba(250, 245, 240, 0.97);
  border-top: 1px solid var(--border);
  display: none;
  z-index: 20;
}
.sticky-cta[data-visible="true"] { display: block; }
.sticky-cta .btn { min-height: 52px; font-size: 15px; }
@media (min-width: 720px) { .sticky-cta { display: none !important; } }

/* ---------- Footer ---------- */
.footer {
  margin-top: 28px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding-bottom: 8px;
}
.footer__note { margin: 0; }
.footer__links { display: flex; justify-content: center; gap: 14px; margin-top: 6px; }
.footer__links a { color: var(--muted); }
.noscript { padding: 24px; text-align: center; }

/* ---------- Consentimiento ---------- */
.consent {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  max-width: 516px;
  margin: 0 auto;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  box-shadow: 0 10px 30px rgba(38, 53, 43, 0.14);
  z-index: 50;
  animation: screen-in 0.4s var(--ease) both;
}
.consent__text { margin: 0 0 12px; font-size: 13px; color: var(--text); }
.consent__actions { display: flex; gap: 8px; justify-content: flex-end; }
.consent__actions .btn { width: auto; }

/* ---------- ALMA PILATES · Presentación (cuadrícula 2 × 2) ---------- */
.program-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 4px 0 0;
}
.program-card {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.program-card img {
  width: 100%;

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')

    if (base.charAt(base.length - 1) !== '/') base += '/';
    return base + name + '.webp';

  function joinList(items) {
    if (!items.length) return 'todo el cuerpo';
    if (items.length === 1) return items[0];
    return items.slice(0, -1).join(', ') + ' y ' + items[items.length - 1];
  }

  function money(value, currency) {
    return '$' + Number(value).toFixed(2) + ' ' + (currency || 'USD');

    text = String(text || '');
    return text.charAt(0).toUpperCase() + text.slice(1);

  // Solo estos campos pueden salir hacia Meta. Nada de respuestas del quiz.
  function sanitize(params) {
    var allowed = ['variant', 'value', 'currency', 'content_ids', 'content_name', 'content_type', 'progress'];
    var clean = {};
    allowed.forEach(function (k) {
      if (params && params[k] !== undefined && params[k] !== null) clean[k] = params[k];
    });
    return clean;
  }

  function track(name, params, custom) {
    if (!pixelReady || !window.fbq) return;
    var payload = sanitize(params);
    window.fbq(custom ? 'trackCustom' : 'track', name, payload);
  }

  function productParams(extra) {
    var base = {
      content_ids: [CFG.productId || 'producto'],
      content_name: CFG.productName || '',
      content_type: 'product',
      value: Number(CFG.price || 0),
      currency: CFG.currency || 'USD',
      variant: state.variant
    };
    return Object.assign(base, extra || {});
  }

  // API pública para la página de confirmación del pedido.
  // Purchase solo debe llamarse cuando el pago esté confirmado (no desde el quiz ni desde un clic).
  window.MiraTracking = {
    purchaseConfirmed: function (opts) {
      opts = opts || {};
      if (!opts.orderId) return false;
      var key = PURCHASE_PREFIX + String(opts.orderId);
      try {
        if (window.localStorage.getItem(key)) return false; // ya enviado
        window.localStorage.setItem(key, '1');
      } catch (e) { /* noop */ }
      ensurePixel();
      track('Purchase', {
        value: Number(opts.value || CFG.price || 0),
        currency: opts.currency || CFG.currency || 'USD',
        content_ids: [CFG.productId || 'producto'],
        content_name: CFG.productName || '',
        content_type: 'product'
      });
      return true;
    }
  };

  function checkMilestones() {
    var total = list().length - 1;
    var pct = total > 0 ? (state.index / total) * 100 : 0;
    [25, 50, 75].forEach(function (m) {
      if (pct >= m && !state.milestones[m]) {
        state.milestones[m] = true;
        track('QuizProgress' + m, { progress: m, variant: state.variant }, true);
      }
    });
    saveState();
  }

  // ---------- Plan personalizado (cálculo real con las respuestas) ----------
  function limitationList(a) {
    return (a.limitations || []).filter(function (x) { return LIMIT_LABEL[x]; });
  }

  function computePlan(answers) {
    var a = answers || {};
    var activity = a.activity || 'none';
    var score = ACTIVITY_SCORE[activity] || 0;
    if (a.energy === 'low') score -= 1;
    if (a.energy === 'very_good') score += 1;
    var lims = limitationList(a);
    if (lims.length) score -= 1;

    // Con molestias físicas la intensidad inicial siempre es suave
    var intensity = (lims.length || score <= 1) ? 'Suave' : 'Progresiva';

    var zones = (a.zones || []).map(function (z) { return ZONE_LABEL[z]; }).filter(Boolean);
    if ((a.zones || []).indexOf('full') !== -1) zones = [];
    var zonesText = joinList(zones);

    var freq;
    if (a.frequency === 'daily') freq = 7;
    else freq = parseInt(a.frequency, 10) || CFG.defaultFrequency || 3;
    var scheduleText = freq >= 7 ? 'todos los días' : freq + ' días a la semana';
    var frequencyLabel = freq >= 7 ? 'Todos los días' : freq + ' días a la semana';

    var minutes = CFG.dailyMinutes || 15;
    var timeNote = '';
    if (a.time && Number(a.time) < minutes) {
      timeNote = 'Tu programa está pensado para ' + minutes + ' minutos al día. Si hoy tienes menos tiempo, avanza a tu ritmo.';
    }
    var limitNote = '';
    if (lims.length) {
      limitNote = 'Notamos molestias en ' + joinList(lims.map(function (x) { return LIMIT_LABEL[x]; })) +
        '. Antes de comenzar, consulta con un profesional de la salud y adapta cada ejercicio a tu cuerpo. Si sientes dolor, detente.';
    }

    var levelLabel = ACTIVITY_LABEL[activity] || ACTIVITY_LABEL.none;
    var goalLabel = GOAL_LABEL[a.goal] || GOAL_LABEL.routine;
    var modality = MODALITY_LABEL[a.preference] || MODALITY_LABEL.combo;
    var goalPhrase = GOAL_PHRASE[a.goal] || GOAL_PHRASE.routine;

    // Calendario de 28 días: los días de entrenamiento se reparten a lo largo de la semana
    var trainDow = {};
    if (freq >= 7) {
      for (var all = 0; all < 7; all++) trainDow[all] = true;
    } else {
      for (var i = 0; i < freq; i++) trainDow[Math.floor((i * 7) / freq)] = true;
    }
    var calendar = [];
    for (var d = 0; d < 28; d++) {
      calendar.push({ day: d + 1, train: !!trainDow[d % 7], phase: PHASES[Math.floor(d / 7)] });
    }
    var trainingDays = calendar.filter(function (c) { return c.train; }).length;

    return {
      levelLabel: levelLabel,
      goalLabel: goalLabel,
      modality: modality,
      intensity: intensity,
      zonesText: zonesText,
      scheduleText: scheduleText,
      frequencyLabel: frequencyLabel,
      minutes: minutes,
      durationLabel: minutes + ' minutos al día',
      trainingDays: trainingDays,
      calendar: calendar,
      timeNote: timeNote,
      limitNote: limitNote,
      personalGoalText: PERSONAL_GOAL_TEXT[a.personalGoal] || '',
      summary: 'Tu plan se enfoca en ' + zonesText + ' y en ' + goalPhrase + ', con sesiones de ' + minutes + ' minutos.'
    };
  }

      case 'multi':
        return Array.isArray(a[def.key]) && a[def.key].length >= (def.min || 0);

  }

      def.options.forEach(function (o) {

          '<span class="option__mark">' + checkIcon() + '</span></button></li>';
      });
      html += '</ul>';
      html += '<p class="note note--alert" data-limit-note' + (selected.some(function (x) { return LIMIT_LABEL[x]; }) ? '' : ' hidden') + '>' +
        'Gracias por compartirlo. Te recomendamos consultar con un profesional de la salud antes de comenzar y adaptar los ejercicios a tu caso.</p>';
      html += '<div class="cta-wrap">' + nextBtn('Continuar') + '</div>';
      return { html: html, group: true };
    } else if (def.kind === 'number') {
      var value = answered === null || answered === undefined ? def.def : answered;
      html += '<div class="number-box">' +
        '<p class="number-box__value" data-number-display>' + value + '<span class="number-box__unit">' + esc(def.unit) + '</span></p>' +
        '<input class="range" type="range" min="' + def.min + '" max="' + def.max + '" step="1" value="' + value + '" data-range="' + def.key + '" aria-label="' + esc(def.title) + '">' +
        '<div class="range__ends"><span>' + def.min + ' ' + esc(def.unit) + '</span><span>' + def.max + ' ' + esc(def.unit) + '</span></div>' +

      html += '<div class="cta-wrap">' + nextBtn('Continuar', 'js-save-number') +
        '<button class="btn btn--link" type="button" data-action="skip">Omitir esta pregunta</button></div>';
      return { html: html, group: false, number: true };
    }

    if (def.footer) html += '<p class="footer__note" style="text-align:center;margin:4px 0 0">' + esc(def.footer) + '</p>';
    return { html: html, group: def.kind !== 'cards' && def.kind !== 'photo' };
  }

  function startLoadingAnimation() {
    var items = stage.querySelectorAll('[data-steps] li');
    var total = items.length;
    items.forEach(function (li, i) {
      timers.push(setTimeout(function () { li.classList.add('is-active'); }, i * LOADING_STEP_MS));
      timers.push(setTimeout(function () {
        li.classList.remove('is-active');
        li.classList.add('is-done');
      }, (i + 1) * LOADING_STEP_MS - 120));
    });
    timers.push(setTimeout(function () {
      if (currentId() !== LOADING_ID) return;
      goTo(1);
    }, total * LOADING_STEP_MS + 380));
  }

  function renderCurrent(direction) {
    clearTimers();
    busy = false;
    var def = currentDef();
    var html = '';
    var isLoading = def.kind === 'loading';

    switch (def.kind) {
      case 'loading': html = renderLoading(); break;
      case 'results': html = renderResults(); break;
      case 'presentation': html = renderPresentation(); break;
      case 'offer': html = renderOffer(); break;
      case 'info': html = renderInfo(def); break;
      case 'pillars': html = renderPillars(def); break;
      default: html = renderQuestion(def).html;
    }

    stage.innerHTML = '<section class="screen' + (direction === 'back' ? ' screen--back' : '') + '" data-screen="' + currentId() + '">' + html + '</section>';

    // Enlaces de navegación y barra
    var total = list().length;
    var pct = total > 1 ? (state.index / (total - 1)) * 100 : 0;
    progressBar.style.width = pct.toFixed(1) + '%';
    progressEl.setAttribute('aria-valuenow', String(Math.round(pct)));
    stepCount.textContent = isLoading ? '' : (state.index + 1) + ' / ' + total;
    backBtn.hidden = state.index === 0 || isLoading;

    var stickyVisible = def.kind === 'offer';
    ensureSticky(stickyVisible);

    if (def.kind === 'presentation') {
      track('ViewContent', productParams());
    }
    if (isLoading) startLoadingAnimation();

    checkMilestones();
    window.scrollTo({ top: 0, behavior: 'auto' });
    stage.focus({ preventScroll: true });
  }

  function ensureSticky(visible) {
    var bar = document.getElementById('sticky-cta');
    if (!visible) {
      if (bar) bar.remove();
      return;
    }
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'sticky-cta';
      bar.className = 'sticky-cta';
      bar.setAttribute('data-visible', 'true');
      bar.innerHTML = '<button class="btn btn--primary" type="button" data-action="checkout">' + esc(CFG.checkoutButtonLabel || '¡Sí, quiero comenzar mi plan!') + '</button>';
      (document.getElementById('mira-root') || document.body).appendChild(bar);
    }
  }

  function goTo(delta) {
    var nextIndex = state.index + delta;
    if (nextIndex < 0 || nextIndex >= list().length) return;
    if (delta > 0 && !isAnswered(currentDef())) return;

    var direction = delta > 0 ? 'forward' : 'back';
    // Evita volver a la pantalla de carga: retrocede una más
    if (direction === 'back' && list()[nextIndex] === LOADING_ID) {
      nextIndex -= 1;
      if (nextIndex < 0) return;
    }
    state.index = nextIndex;
    saveState();
    renderCurrent(direction);
  }

  function recordAnswer(key, value) {
    state.answers[key] = value;
    if (!state.started) {
      state.started = true;
      track('QuizStarted', { variant: state.variant }, true);
    }
    saveState();
  }

  // ---------- Eventos (delegación) ----------
  function handleAction(target) {
    var action = target.getAttribute('data-action');
    var def = currentDef();
    if (!def) return;

    if (action === 'pick') {
      if (busy) return;
      var key = target.getAttribute('data-key');
      var value = target.getAttribute('data-value');
      recordAnswer(key, value);
      var pressedNodes = stage.querySelectorAll('[data-key="' + key + '"][aria-pressed]');
      pressedNodes.forEach(function (n) { n.setAttribute('aria-pressed', n === target ? 'true' : 'false'); });
      if (def.auto) {
        busy = true;
        var from = state.index;
        timers.push(setTimeout(function () {
          if (state.index === from) goTo(1); // solo si la usuaria sigue en la misma pantalla
        }, 260));
      }
      return;
    }

    if (action === 'toggle') {
      var k = target.getAttribute('data-key');
      var v = target.getAttribute('data-value');
      var current = Array.isArray(state.answers[k]) ? state.answers[k].slice() : [];
      var exclusive = target.getAttribute('data-exclusive') === 'true';
      var isOn = current.indexOf(v) !== -1;
      if (isOn) {
        current = current.filter(function (x) { return x !== v; });
      } else {
        if (exclusive) {
          current = [v];
        } else {
          current = current.filter(function (x) {
            var opt = def.options.filter(function (o) { return o.value === x; })[0];
            return !(opt && opt.exclusive);
          });
          current.push(v);
        }
      }
      recordAnswer(k, current);
      stage.querySelectorAll('[data-key="' + k + '"][data-value]').forEach(function (btn) {
        btn.setAttribute('aria-pressed', current.indexOf(btn.getAttribute('data-value')) !== -1 ? 'true' : 'false');
      });
      var note = stage.querySelector('[data-limit-note]');
      if (note) {
        var hasLimit = current.some(function (x) { return LIMIT_LABEL[x]; });
        note.hidden = !hasLimit;
      }
      return;
    }

    if (action === 'next') {
      if (def.kind === 'number') {
        var rng = stage.querySelector('[data-range]');
        if (rng) recordAnswer(def.key, Number(rng.value));
      }
      if (!isAnswered(def)) return;
      goTo(1);
      return;
    }

    if (action === 'skip') {
      recordAnswer(def.key, null);
      goTo(1);
      return;
    }

    if (action === 'restart') {
      state = defaultState();
      state.variant = resolveVariant();
      saveState();
      clearTimers();
      renderCurrent('back');
      return;
    }

    if (action === 'checkout') {
      track('InitiateCheckout', productParams());
      var cta = stage.querySelector('[data-cta-note]');
      if (!CFG.checkoutUrl) {
        if (cta) cta.textContent = 'El checkout aún no está configurado. Agrega la URL en config.js.';
        return;
      }
      window.location.href = buildCheckoutUrl();
    }
  }

  function bindEvents() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-action]');
      if (!t) return;
      if (t.id === 'back-btn') return;
      handleAction(t);
    });

    backBtn.addEventListener('click', function () {
      goTo(-1);
    });

    stage.addEventListener('input', function (e) {
      var rng = e.target.closest('[data-range]');
      if (!rng) return;
      var def = currentDef();
      var display = stage.querySelector('[data-number-display]');
      if (display && def) {
        display.innerHTML = rng.value + '<span class="number-box__unit">' + esc(def.unit) + '</span>';
      }
    });

    // Navegación con teclado: flechas entre opciones de un grupo
    stage.addEventListener('keydown', function (e) {
      var keys = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
      if (!keys[e.key]) return;
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var group = btn.parentElement && btn.parentElement.parentElement;
      if (!group) return;
      var items = Array.prototype.slice.call(group.querySelectorAll('button[data-action]'));
      var idx = items.indexOf(btn);
      if (idx === -1) return;
      var nextEl = items[(idx + keys[e.key] + items.length) % items.length];
      e.preventDefault();
      nextEl.focus();
    });

    // Enter en el rango guarda y avanza
    stage.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-range]')) {
        e.preventDefault();
        stage.querySelector('.js-save-number').click();
      }
    });

    document.getElementById('consent-accept').addEventListener('click', function () {
      try { window.localStorage.setItem(CONSENT_KEY, 'granted'); } catch (e) { /* noop */ }
      hideConsent();
      ensurePixel();
      track('PageView', { variant: state.variant });
    });
    document.getElementById('consent-reject').addEventListener('click', function () {
      try { window.localStorage.setItem(CONSENT_KEY, 'rejected'); } catch (e) { /* noop */ }
      hideConsent();
    });
  }

  function hideConsent() {
    document.getElementById('consent').hidden = true;
  }

  function init() {
    stage = document.getElementById('stage');
    backBtn = document.getElementById('back-btn');
    stepCount = document.getElementById('step-count');
    progressBar = document.getElementById('progress-bar');
    progressEl = progressBar.parentElement;
    brandEl = document.getElementById('brand');
    footerLinks = document.getElementById('footer-links');

    captureUtm();
    renderBrand();
    renderFooterLinks();

    var urlVariant = resolveVariant();
    if (state.variant && state.variant !== urlVariant) {
      state = defaultState(); // cambio explícito de variante: empieza de nuevo
    }
    state.variant = urlVariant;
    if (state.index < 0 || state.index >= list().length) state.index = 0;
    saveState();

    bindEvents();

    var consent = consentStatus();
    if (consent === 'granted') {
      ensurePixel();
      track('PageView', { variant: state.variant });
    } else if (consent !== 'rejected') {
      document.getElementById('consent').hidden = false;
    }

    // Si el usuario recargó durante la pantalla de carga, la carga vuelve a correr
    renderCurrent('forward');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
